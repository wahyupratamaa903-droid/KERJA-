<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Monitoring Sarana Lapangan</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/kill-cache.js"></script>
</head>
<body>
  <div class="wrapper">
    <header class="top-header-bar">
      <div class="header-brand"><span class="brand-title">PT DEVIS JAYA</span><span class="live-pill"><span class="live-dot"></span><span id="label-sync-status">Firebase Live</span></span></div>
      <div class="header-actions">
        <button id="btn-buka-vault" class="btn-header-action vault">🛡️ Brankas</button>
        <button id="btn-toggle-auth" class="btn-header-action auth">🔐 Tamu</button>
      </div>
    </header>

    <main id="view-sarana" class="tab-view active">
      <section class="panel-statistik">
        <div class="stat-item"><span class="stat-angka" id="stat-total">0</span><span class="stat-label">Total Sarana</span></div>
        <div class="stat-item danger"><span class="stat-angka" id="stat-isi">0</span><span class="stat-label">Perlu Diisi</span></div>
      </section>

      <div class="toolbar-lapangan">
        <button id="btn-tool-rute" class="btn-tool"><span>🧭</span><span>Rute Urut</span></button>
        <button id="btn-tool-anggaran" class="btn-tool"><span>💰</span><span>Estimasi</span></button>
        <button id="btn-tool-pdf" class="btn-tool"><span>📄</span><span>PDF Formal</span></button>
        <button id="btn-tool-jarvis-brief" class="btn-tool" style="border-color: rgba(6, 182, 212, 0.4);"><span>🎙️</span><span>Brief AI</span></button>
      </div>

      <div class="kontrol-pencarian">
        <h2 class="judul-bagian">Daftar Sarana Lapangan</h2>
        <input type="text" id="input-cari" class="input-cari-jalan" placeholder="Cari nama jalan atau tipe sarana...">
        
        <div style="display:flex; gap:6px; margin:8px 0; overflow-x:auto;">
          <select id="filter-tipe" style="padding:4px; font-size:0.75rem; background:#1e293b; color:#fff; border-radius:4px;"><option value="">Semua Tipe</option><option value="Billboard">Billboard</option><option value="Baliho">Baliho</option></select>
          <select id="filter-lampu" style="padding:4px; font-size:0.75rem; background:#1e293b; color:#fff; border-radius:4px;"><option value="">Semua Lampu</option><option value="FL">Lampu FL</option><option value="BL">Lampu BL</option></select>
        </div>

        <div class="filter-tabs">
          <button class="tab-filter active" data-filter="semua">Semua</button>
          <button class="tab-filter" data-filter="perlu-isi">Perlu Diisi</button>
          <button class="tab-filter" data-filter="aman">Aman</button>
        </div>
      </div>

      <div id="daftar-sarana"></div>
    </main>

    <main id="view-peta" class="tab-view"><div id="peta-gis"></div></main>

    <main id="view-misi" class="tab-view">
      <section class="misi-card">
        <div class="misi-header"><div><h3>Misi Lapangan Hari Ini</h3></div></div>
        <div id="container-list-misi" class="misi-list-box"></div>
      </section>
      <section class="misi-card">
        <div class="misi-header"><div><h3>BBM Mingguan</h3></div><span class="badge-bbm-limit">Rp 50.000</span></div>
        <div class="bbm-saldo-box">
          <div class="bbm-saldo-item"><span class="lbl">Sisa Saldo:</span><strong id="bbm-sisa-rp" class="val-sisa">Rp 50.000</strong></div>
          <div class="bbm-saldo-item right"><span class="lbl">Terpakai:</span><span id="bbm-terpakai-rp" class="val-pakai">Rp 0</span></div>
        </div>
        <div class="bbm-progress-bg"><div id="bbm-progress-fill" class="bbm-progress-fill" style="width: 100%;"></div></div>
        <div id="box-aksi-bbm">
          <div class="bbm-quick-buttons">
            <button class="btn-preset-bbm" data-nominal="20000">+ Rp 20rb</button>
            <button class="btn-preset-bbm" data-nominal="50000">+ Rp 50rb</button>
          </div>
          <form id="form-catat-bbm" class="bbm-quick-form"><input type="number" id="input-nominal-bbm"><button type="submit" class="btn-catat-bbm">Catat</button></form>
        </div>
        <div id="list-riwayat-bbm" class="bbm-riwayat-list" style="margin-top:12px;"></div>
      </section>
    </main>
  </div>

  <div id="hud-voice" class="hud-voice-banner"><span class="live-dot" style="background:#ef4444;"></span><span id="teks-hud-voice">Devis Jarvis mendengarkan...</span></div>
  <button id="fab-voice-cmd" class="fab-jarvis-mic">🎙️</button>

  <div id="modal-anggaran" class="modal-backdrop"><div class="modal-konten">
    <h3>Estimasi Anggaran Token</h3>
    <div id="konten-rincian-anggaran"></div>
    <button id="btn-tutup-anggaran" style="margin-top:12px;">Tutup</button>
  </div></div>
  
  <div id="modal-auth" class="modal-backdrop"><div class="modal-konten">
    <h3>Akses Petugas</h3>
    <form id="form-auth-pin"><input type="password" id="input-pin-petugas" required><button type="submit">Verifikasi</button></form>
  </div></div>

  <nav class="nav-bottom">
    <button class="nav-item active" data-tab="view-sarana">📍 Sarana</button>
    <button class="nav-item" data-tab="view-peta">🗺️ Peta Radar</button>
    <button class="nav-item" id="nav-tab-misi" data-tab="view-misi">📋 Misi Kerja</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
