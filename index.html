<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Sarana & Token</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Monitoring Sarana Lapangan</h1>

    <form id="form-sarana">
      <div class="field">
        <label for="lokasi">Nama Titik / Lokasi</label>
        <input type="text" id="lokasi" placeholder="Contoh: Jl. S. Parman" required>
      </div>

      <div class="field">
        <label for="tipe">Tipe Sarana</label>
        <select id="tipe">
          <option value="Billboard">Billboard</option>
          <option value="Baliho">Baliho</option>
          <option value="Bando Jalan">Bando Jalan</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <div class="field">
        <label for="jumlahLampu">Jumlah Titik Lampu</label>
        <input type="number" id="jumlahLampu" placeholder="Contoh: 5" required>
      </div>

      <div class="field">
        <label for="wattPerLampu">Daya per Lampu (Watt / FL)</label>
        <input type="number" id="wattPerLampu" value="40" placeholder="40" required>
      </div>

      <div class="field">
        <label for="sisaKwh">Sisa Token Listrik (kWh)</label>
        <input type="number" step="0.1" id="sisaKwh" placeholder="Contoh: 12.5" required>
      </div>

      <div class="field">
        <label for="fotoSarana">Foto Sarana</label>
        <input type="file" id="fotoSarana" accept="image/*" capture="environment">
      </div>

      <button type="submit">Simpan & Hitung Status</button>
    </form>

    <h2>Daftar Sarana</h2>
    <div id="daftar-sarana"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
