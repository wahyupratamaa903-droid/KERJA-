<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Kerja Lapangan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>Monitoring Sarana Lapangan</h1>
      <p>Pencatatan Sarana & Prediksi Token Listrik</p>
    </header>

    <section class="panel-statistik">
      <div class="stat-item">
        <span class="stat-angka" id="stat-total">0</span>
        <span class="stat-label">Total Sarana</span>
      </div>
      <div class="stat-item danger">
        <span class="stat-angka" id="stat-isi">0</span>
        <span class="stat-label">Perlu Diisi</span>
      </div>
    </section>

    <form id="form-sarana" class="form-box">
      <h2 class="form-title">Catat Titik Sarana Baru</h2>

      <div class="form-group">
        <label for="lokasi">Nama Titik / Lokasi Jalan</label>
        <input type="text" id="lokasi" placeholder="Contoh: Jl. S. Parman (Dekat Amira)" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tipe">Tipe Sarana</label>
          <select id="tipe">
            <option value="Billboard">Billboard</option>
            <option value="Baliho">Baliho</option>
            <option value="Bando Jalan">Bando Jalan</option>
            <option value="Neon Box">Neon Box</option>
          </select>
        </div>

        <div class="form-group">
          <label for="jenisLampu">Jenis Lampu</label>
          <select id="jenisLampu">
            <option value="FL">FL (Front Light / Luar)</option>
            <option value="BL">BL (Back Light / Dalam)</option>
            <option value="NONE">Tanpa Lampu</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="jumlahLampu">Jumlah Titik Lampu</label>
        <input type="number" id="jumlahLampu" placeholder="Jumlah titik lampu FL" min="0">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tanggalPengecekan">Tanggal Catat</label>
          <input type="date" id="tanggalPengecekan" required>
        </div>

        <div class="form-group">
          <label for="sisaKwh">Sisa Token (kWh)</label>
          <input type="number" step="any" id="sisaKwh" placeholder="Contoh: 10542" required>
        </div>
      </div>

      <div class="form-group">
        <label>Titik Koordinat GPS</label>
        <div class="gps-wrapper">
          <button type="button" id="btn-ambil-gps" class="btn-gps">Kunci GPS Sekarang</button>
          <span id="status-gps" class="status-gps-text">Belum diambil</span>
        </div>
      </div>

      <div class="form-group">
        <label for="fotoSarana">Dokumentasi Foto (Pilih dari Galeri)</label>
        <input type="file" id="fotoSarana" accept="image/jpeg,image/png,image/webp" multiple>
      </div>

      <button type="submit" class="btn-submit">Simpan Sarana</button>
    </form>

    <div class="kontrol-pencarian">
      <h2 class="judul-bagian">Daftar Sarana</h2>
      <input type="text" id="input-cari" class="input-cari-jalan" placeholder="Cari nama jalan atau tipe sarana...">
      <div class="filter-tabs">
        <button class="tab-filter active" data-filter="semua">Semua</button>
        <button class="tab-filter" data-filter="perlu-isi">Perlu Diisi</button>
        <button class="tab-filter" data-filter="aman">Aman</button>
      </div>
    </div>

    <div id="daftar-sarana"></div>
  </div>

  <!-- Modal Catat Token Baru -->
  <div id="modal-update" class="modal-backdrop">
    <div class="modal-konten">
      <h3 style="margin-bottom: 6px;">Catat Token Baru</h3>
      <p id="nama-sarana-modal" style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px;"></p>

      <form id="form-update">
        <div class="form-group">
          <label for="modalTanggal">Tanggal Cek Baru</label>
          <input type="date" id="modalTanggal" required>
        </div>

        <div class="form-group">
          <label for="modalKwh">Sisa Token Sekarang (kWh)</label>
          <input type="number" step="any" id="modalKwh" placeholder="Contoh: 5000" required>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 14px;">
          <button type="button" id="btn-tutup-modal" class="btn-hapus">Batal</button>
          <button type="submit" class="btn-submit">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lightbox Foto -->
  <div id="modal-foto" class="modal-backdrop">
    <img id="img-zoom" class="modal-foto-isi" alt="Zoom Foto">
  </div>

  <nav class="nav-bottom">
    <a href="#" class="nav-item active">
      <span>📍</span>
      <span>Sarana</span>
    </a>
    <a href="#" class="nav-item" onclick="alert('Menu fitur berikutnya akan ditambahkan di sini.')">
      <span>➕</span>
      <span>Fitur Baru</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
